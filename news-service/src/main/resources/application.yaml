spring:
  application:
    name: news-service
  config:
    import: "optional:file:./.env[.properties],optional:file:./news-service/.env[.properties],optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}/"
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1500
        max-attempts: 4
        max-interval: 5000
        multiplier: 1.5
  datasource:
    hikari:
      initialization-fail-timeout: -1
