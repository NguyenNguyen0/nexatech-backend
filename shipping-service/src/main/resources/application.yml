server:
  port: 8091

spring:
  application:
    name: shipping-service
  config:
    import: "optional:file:./.env[.properties],optional:file:./shipping-service/.env[.properties],optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}/"
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1500
        max-attempts: 4
        max-interval: 5000
        multiplier: 1.5
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexatech_shipping}
    username: ${DB_USERNAME:nexatech}
    password: ${DB_PASSWORD:nexatech123}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: shipping-service-group
      properties:
        request.timeout.ms: 30000
        default.api.timeout.ms: 30000
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 10000

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

shipping:
  provider: ghn # mock | ghn
  creation:
    max-attempts: ${SHIPPING_CREATION_MAX_ATTEMPTS:3}
    retry-delay-ms: ${SHIPPING_CREATION_RETRY_DELAY_MS:1500}
  ghn:
    base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
    token: ${GHN_TOKEN:}
    shop-id: ${GHN_SHOP_ID:}
    from-district-id: ${GHN_FROM_DISTRICT_ID:}
    from-ward-code: ${GHN_FROM_WARD_CODE:}
    from-name: ${GHN_FROM_NAME:NexaTech Warehouse}
    from-phone: ${GHN_FROM_PHONE:0987654321}
    from-address: ${GHN_FROM_ADDRESS:Thu Duc, Ho Chi Minh City}
    from-province-name: ${GHN_FROM_PROVINCE_NAME:TP. Hồ Chí Minh}
    from-district-name: ${GHN_FROM_DISTRICT_NAME:Thành phố Thủ Đức}
    from-ward-name: ${GHN_FROM_WARD_NAME:Linh Trung}
