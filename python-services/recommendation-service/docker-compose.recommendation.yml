services:
  recommendation-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexatech-recommendation-service
    environment:
      PORT: 8095
      EUREKA_ENABLED: "false"
      MONGO_URI: mongodb://nexatech:nexatech123@mongodb:27017/recommendation?authSource=admin
      MONGO_DATABASE: recommendation
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_BEHAVIOR_TOPIC: user-behavior-events
      KAFKA_PRODUCT_TOPIC: product.events
      PRODUCT_SERVICE_BASE_URL: http://product-service:8090
      PRODUCT_SERVICE_CATALOG_PATH: /api/v1/internal/products/all
      PRODUCT_SERVICE_API_KEY: change-me
      PRODUCT_SERVICE_LOOKUP_PATH: /api/v1/internal/products/lookup
      MODELS_DIR: /models
      OPENBLAS_NUM_THREADS: "1"
    ports:
      - "8095:8095"
    volumes:
      - recommendation_models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8095/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  recommendation_models:
