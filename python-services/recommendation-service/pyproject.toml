[project]
name = "recommendation-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic-settings>=2.10.1",
    "py-eureka-client>=0.13.2",
    "motor>=3.7.1",
    "redis[hiredis]>=6.2.0",
    "aiokafka>=0.12.0",
    "httpx>=0.28.1",
    "aiofiles>=24.1.0",
    "numpy>=2.3.0",
    "scipy>=1.16.0",
    "scikit-learn>=1.7.0",
    "joblib>=1.5.1",
    "implicit>=0.7.2",
    "apscheduler>=3.11.0",
    "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.13",
    "mypy>=1.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
