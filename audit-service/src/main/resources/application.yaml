server:
  port: ${SERVER_PORT:8096}

spring:
  application:
    name: audit-service
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties],optional:file:./audit-service/.env[.properties],optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}/"
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1500
        max-attempts: 4
        max-interval: 5000
        multiplier: 1.5
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: "${SPRING_MONGODB_URI:mongodb://nexatech:nexatech123@localhost:27017/nexatech_audit?authSource=admin&authMechanism=SCRAM-SHA-256}"
    representation:
      uuid: JAVA_LEGACY
  data:
    mongodb:
      auto-index-creation: true
    web:
      pageable:
        one-indexed-parameters: true
        max-page-size: 20
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:audit-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    topic:
      audit-log: ${AUDIT_LOG_TOPIC:audit-topic}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/nexatech}

springdoc:
  api-docs:
    enabled: false
    version: OPENAPI_3_0
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      status:
        http-mapping:
          UP: 200
          DOWN: 503
  health:
    mongodb:
      enabled: false
  info:
    env:
      enabled: true

logging:
  level:
    root: INFO
    com.nexatech: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
