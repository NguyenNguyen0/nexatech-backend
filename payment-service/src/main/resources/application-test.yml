server:
  port: 8086

spring:
  config:
    import: "optional:configserver:"
  datasource:
    url: jdbc:postgresql://localhost:5437/nexatech_payments
    username: nexatech
    password: nexatech123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service-group
      properties:
        request.timeout.ms: 30000
        default.api.timeout.ms: 30000
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 10000

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.nexatech: DEBUG

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

vnpay:
  tmn-code: EMCFMDKQ
  hash-secret: RAOEXHYVSDDIIENYWSLDIIZTANXUXZFJ
  payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:8086/api/v1/payments/vnpay/return
  ipn-url: http://localhost:8086/api/v1/payments/vnpay/ipn
