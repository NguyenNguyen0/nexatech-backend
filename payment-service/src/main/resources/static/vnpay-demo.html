<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaTech — Demo Thanh Toán VNPay</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 40px 48px;
            width: 100%;
            max-width: 480px;
        }
        h1 {
            color: #1a1a2e;
            font-size: 1.6rem;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .badge {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.78rem;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.88rem;
            color: #555;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 0.95rem;
            margin-bottom: 18px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus, select:focus {
            border-color: #005baa;
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: #005baa;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #003f7f; }
        .btn:disabled { background: #9cb3cc; cursor: not-allowed; }
        #result {
            margin-top: 22px;
            padding: 14px;
            border-radius: 7px;
            display: none;
        }
        .result-ok   { background: #d1fae5; border: 1px solid #34d399; color: #065f46; }
        .result-err  { background: #fee2e2; border: 1px solid #f87171; color: #7f1d1d; }
        .result-info { background: #e0f2fe; border: 1px solid #38bdf8; color: #075985; }
        .loader {
            display: inline-block;
            width: 15px; height: 15px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-left: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .url-box {
            word-break: break-all;
            font-size: 0.80rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            padding: 8px 10px;
            margin-top: 8px;
        }
        a.url-link { color: #005baa; text-decoration: underline; }
        .divider { border: none; border-top: 1px solid #e5e7eb; margin: 24px 0; }
        .note { font-size: 0.82rem; color: #888; line-height: 1.5; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏧 Demo VNPay</h1>
    <p class="subtitle">NexaTech Payment Service — Sandbox</p>
    <span class="badge">⚠️ Môi trường thử nghiệm (Sandbox)</span>

    <form id="payForm" onsubmit="handleSubmit(event)">
        <label for="customerId">Customer ID (UUID)</label>
        <input type="text" id="customerId" value="00000000-0000-0000-0000-000000000001"
               placeholder="UUID của customer" required/>

        <label for="orderId">Order ID (UUID)</label>
        <input type="text" id="orderId" placeholder="UUID của đơn hàng đã tạo" required/>

        <label for="amount">Số tiền (VND)</label>
        <input type="number" id="amount" value="150000" min="5000" step="1000"
               placeholder="Ví dụ: 150000" required/>

        <label for="orderInfo">Mô tả đơn hàng</label>
        <input type="text" id="orderInfo" value="Thanh toan don hang NexaTech"
               placeholder="Hiển thị trên trang VNPay" required/>

        <button type="submit" class="btn" id="submitBtn">
            Tạo URL Thanh Toán VNPay
        </button>
    </form>

    <div id="result"></div>

    <hr class="divider"/>
    <p class="note">
        <strong>Thẻ test VNPay Sandbox:</strong><br/>
        Ngân hàng: NCB &nbsp;|&nbsp; Số thẻ: <code>9704198526191432198</code><br/>
        Ngày phát hành: <code>07/15</code> &nbsp;|&nbsp; Tên: <code>NGUYEN VAN A</code><br/>
        OTP: <code>123456</code>
    </p>
</div>

<script>
    async function handleSubmit(e) {
        e.preventDefault();

        const btn    = document.getElementById('submitBtn');
        const result = document.getElementById('result');

        const customerId = document.getElementById('customerId').value.trim();
        const orderId    = document.getElementById('orderId').value.trim();
        const amount     = parseFloat(document.getElementById('amount').value);
        const orderInfo  = document.getElementById('orderInfo').value.trim();

        btn.disabled = true;
        btn.innerHTML = 'Đang xử lý <span class="loader"></span>';
        result.style.display = 'none';

        try {
            const resp = await fetch('/api/v1/payments/vnpay/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-Id': customerId
                },
                body: JSON.stringify({ orderId, amount, orderInfo, ipAddress: '127.0.0.1' })
            });

            const data = await resp.json();

            if (!resp.ok) {
                throw new Error(data.message || JSON.stringify(data));
            }

            result.className = 'result result-ok';
            result.innerHTML = `
                <strong>✅ Tạo URL thành công!</strong><br/>
                Payment ID: <code>${data.paymentId}</code>
                <div class="url-box">
                    <a class="url-link" href="${data.paymentUrl}" target="_blank">
                        ${data.paymentUrl}
                    </a>
                </div>
                <br/>
                <button class="btn" onclick="window.open('${data.paymentUrl}', '_blank')" style="margin-top:0">
                    Mở Trang Thanh Toán VNPay ↗
                </button>`;
            result.style.display = 'block';

        } catch (err) {
            result.className = 'result result-err';
            result.innerHTML = `<strong>❌ Lỗi:</strong> ${err.message}`;
            result.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Tạo URL Thanh Toán VNPay';
        }
    }
</script>
</body>
</html>
