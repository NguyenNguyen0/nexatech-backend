spring:
  application:
    name: product-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}/,optional:file:./.env[.properties],optional:file:./product-service/.env[.properties],optional:classpath:local-overrides.yml"
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1500
        max-attempts: 4
        max-interval: 5000
        multiplier: 1.5
