trigger:infra-deploy:
  stage: deploy
  image: curlimages/curl:8.10.1
  dependencies:
    - detect:changed-services
  script:
    - 'CHANGED_SERVICES="$(sed -n "s/^CHANGED_SERVICES=//p" changed-services.env)"'
    - |
      if [ -z "${CHANGED_SERVICES:-}" ]; then
        echo "No service image changes detected; skipping infra trigger."
        exit 0
      fi
    - 'echo "Triggering infra pipeline with backend image tag: $CI_COMMIT_SHORT_SHA"'
    - 'echo "Changed services: $CHANGED_SERVICES"'
    - >-
      curl --fail --request POST
      --form "token=$CI_JOB_TOKEN"
      --form "ref=main"
      --form "inputs[backend_image_tag]=$CI_COMMIT_SHORT_SHA"
      --form "inputs[image_tag]=$CI_COMMIT_SHORT_SHA"
      --form "inputs[changed_services]=$CHANGED_SERVICES"
      "$CI_API_V4_URL/projects/software-architecture264301%2Fnexatech-infra/trigger/pipeline"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
