workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
      when: always
    - when: never

stages:
  - prepare
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

detect:changed-services:
  stage: prepare
  image: alpine/git:2.47.2
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      set -eu

      JAVA_SERVICES="api-gateway discovery-server config-server identity-service user-service product-service order-service inventory-service payment-service shipping-service notification-service chat-service storage-service news-service audit-service"
      OTHER_SERVICES="promotion-service agent-service mcp-server recommendation-service"
      ALL_SERVICES="$JAVA_SERVICES $OTHER_SERVICES"

      add_service() {
        case " $CHANGED_SERVICES " in
          *" $1 "*) ;;
          *) CHANGED_SERVICES="$CHANGED_SERVICES $1" ;;
        esac
      }

      add_many() {
        for service in $1; do
          add_service "$service"
        done
      }

      if [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        BASE_SHA="$CI_COMMIT_BEFORE_SHA"
      else
        BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
      fi

      CHANGED_SERVICES=""
      git diff --name-only "$BASE_SHA" "$CI_COMMIT_SHA" > changed-files.txt

      while IFS= read -r file; do
        case "$file" in
          .gitlab-ci.yml)
            add_many "$ALL_SERVICES"
            ;;
          pom.xml|Dockerfile)
            add_many "$JAVA_SERVICES"
            ;;
          api-gateway/*|discovery-server/*|config-server/*|identity-service/*|user-service/*|product-service/*|order-service/*|inventory-service/*|payment-service/*|shipping-service/*|notification-service/*|chat-service/*|storage-service/*|news-service/*|audit-service/*)
            add_service "${file%%/*}"
            ;;
          promotion-service/*)
            add_service promotion-service
            ;;
          python-services/agent-service/*)
            add_service agent-service
            ;;
          python-services/mcp-server/*)
            add_service mcp-server
            ;;
          python-services/recommendation-service/*)
            add_service recommendation-service
            ;;
        esac
      done < changed-files.txt

      CHANGED_SERVICES="$(printf '%s\n' "$CHANGED_SERVICES" | xargs)"
      printf 'CHANGED_SERVICES=%s\n' "$CHANGED_SERVICES" > changed-services.env
      echo "Changed services: ${CHANGED_SERVICES:-<none>}"
  artifacts:
    paths:
      - changed-files.txt
      - changed-services.env
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

.docker-build:
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  before_script:
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - export IMAGE_NAMESPACE="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - export IMAGE_NAME="${IMAGE_NAME:-$SERVICE_NAME}"
    - export DOCKERFILE="${DOCKERFILE:-$SERVICE_NAME/Dockerfile}"
    - export DOCKERFILE_PATH="${DOCKERFILE_PATH:-$CONTEXT/$DOCKERFILE}"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build --pull -f "$DOCKERFILE_PATH" -t "$IMAGE_NAMESPACE/$IMAGE_NAME:$IMAGE_TAG" "$CONTEXT"
    - docker push "$IMAGE_NAMESPACE/$IMAGE_NAME:$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE_NAMESPACE/$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAMESPACE/$IMAGE_NAME:latest"
        docker push "$IMAGE_NAMESPACE/$IMAGE_NAME:latest"
      fi

.java-docker-build:
  extends: .docker-build
  stage: build
  variables:
    CONTEXT: .

build:api-gateway:
  extends: .java-docker-build
  variables:
    SERVICE_NAME: api-gateway
    CONTEXT: .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
      changes:
        - .gitlab-ci.yml
        - Dockerfile
        - pom.xml
        - api-gateway/**/*

