server:
  # Port chuẩn Spring Cloud Config - services client kết nối localhost:8888
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configs

eureka:
  client:
    # Docker: hostname truyền qua env var; local dev: mặc định localhost
    service-url:
      defaultZone: http://${EUREKA_INSTANCE_HOSTNAME:localhost}:8761/eureka/
    # Không bắt buộc Eureka phải online khi chạy local
    enabled: ${EUREKA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
