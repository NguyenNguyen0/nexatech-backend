server:
  port: 8081

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configs

eureka:
  client:
    service-url:
      # Local fallback to avoid placeholder resolution failure
      defaultZone: http://${EUREKA_INSTANCE_HOSTNAME:localhost}:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
