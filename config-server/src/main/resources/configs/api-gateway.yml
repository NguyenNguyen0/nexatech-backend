server:
  port: ${SERVER_PORT:8080}

# Browser clients (e.g. Next.js on :3001) — comma-separated patterns; override with env GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS
gateway:
  cors:
    allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*"

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/nexatech}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Identity — AuthController /auth/**
            - id: identity-auth
              uri: ${IDENTITY_SERVICE_URI:lb://identity-service}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=2
            # User service — /users, /groups, /roles, /permissions
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/groups/**,/api/v1/roles/**,/api/v1/permissions/**
              filters:
                - StripPrefix=2
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/brands/**,/api/v1/reviews/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**,/api/v1/admin/orders/**,/api/v1/returns/**,/api/v1/checkout/**,/api/v1/cart/**,/api/v1/admin/audit/orders/**
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventory/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**,/api/v1/admin/payments/**,/api/v1/admin/audit/payments/**
            - id: shipping-service
              uri: lb://shipping-service
              predicates:
                - Path=/api/v1/shipping/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**
            - id: chat-service
              uri: ${CHAT_SERVICE_URI:lb://chat-service}
              predicates:
                - Path=/api/v1/conversations/**
            - id: chat-service-websocket
              uri: ${CHAT_SERVICE_WS_URI:lb:ws://chat-service}
              predicates:
                - Path=/ws/chat,/ws/chat/**
                - Header=Upgrade, websocket
            - id: chat-service-sockjs
              uri: ${CHAT_SERVICE_URI:lb://chat-service}
              predicates:
                - Path=/ws/chat,/ws/chat/**
            - id: storage-service
              uri: lb://storage-service
              predicates:
                - Path=/api/v1/files/**
            - id: news-service
              uri: lb://news-service
              predicates:
                - Path=/api/v1/news/**
            - id: audit-service
              uri: lb://audit-service
              predicates:
                - Path=/api/v1/admin/audit/**
              filters:
                - StripPrefix=3
            - id: agent-service
              uri: lb://agent-service
              predicates:
                - Path=/api/v1/agent/**
              filters:
                - StripPrefix=3
            - id: mcp-server
              uri: lb://mcp-server
              predicates:
                - Path=/api/v1/mcp/**
              filters:
                - StripPrefix=3
            - id: recommendation-service
              uri: lb://recommendation-service
              predicates:
                - Path=/api/v1/recommend/**
              filters:
                - StripPrefix=2
            - id: recommendation-behavior-ingestion
              uri: lb://recommendation-service
              predicates:
                - Path=/api/v1/behaviors/**
              filters:
                - StripPrefix=2
