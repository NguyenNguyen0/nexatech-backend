server:
  port: 8082

spring:
  main:
    # OpenFeign + DevTools/context refresh can re-register FeignClientSpecification beans with the same name.
    allow-bean-definition-overriding: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/nexatech}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:identity-service-group}
    topics:
      user-registration: user-registration

openfeign:
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:9000}
    realm: ${KEYCLOAK_REALM:nexatech}
    client-id: ${KEYCLOAK_CLIENT_ID:nexatech-id}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:gUZhl1gcgZgpLbzzvXwnExf8DTnK8YuG}
