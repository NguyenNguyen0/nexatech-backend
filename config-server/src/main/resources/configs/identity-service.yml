server:
  port: 8082

spring:
  main:
    # OpenFeign + DevTools/context refresh can re-register FeignClientSpecification beans with the same name.
    allow-bean-definition-overriding: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/nexatech}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:identity-service-group}
    topics:
      user-registration: user-registration
      user-events: user.events
      audit-log: ${AUDIT_LOG_TOPIC:audit-topic}

openfeign:
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:9000}
    realm: ${KEYCLOAK_REALM:nexatech}
    client-id: ${KEYCLOAK_CLIENT_ID:nexatech-id}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:gUZhl1gcgZgpLbzzvXwnExf8DTnK8YuG}
  user-service:
    url: ${OPENFEIGN_USER_SERVICE_URL:http://localhost:8083}

resilience4j:
  retry:
    instances:
      userServiceAvailability:
        base-config: default
  circuitbreaker:
    instances:
      userServiceAvailability:
        base-config: default
