server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

spring:
  main:
    # OpenFeign + DevTools/context refresh can re-register FeignClientSpecification beans with the same name.
    allow-bean-definition-overriding: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT}}
      username: ${SPRING_DATA_REDIS_USERNAME:${REDIS_USERNAME:}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD}}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:${REDIS_SSL_ENABLED:false}}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_GROUP_ID:identity-service-group}
    topics:
      user-registration: user-registration
      user-events: user.events
      audit-log: audit-topic

openfeign:
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:9000}
    realm: ${KEYCLOAK_REALM:nexatech}
    client-id: ${KEYCLOAK_CLIENT_ID:nexatech-id}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  user-service:
    url: ${OPENFEIGN_USER_SERVICE_URL:http://localhost:8083}

resilience4j:
  retry:
    instances:
      userServiceAvailability:
        base-config: default
  circuitbreaker:
    instances:
      userServiceAvailability:
        base-config: default
