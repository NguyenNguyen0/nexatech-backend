server:
  port: 8083

spring:
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    properties:
      security.protocol: PLAINTEXT
  mongodb:
    uri: mongodb://${MONGO_USER:nexatech}:${MONGO_PASSWORD:nexatech123}@localhost:27017/nexatech_products?authSource=admin
    database: nexatech_products
    username: nexatech
    password: nexatech123
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 55MB