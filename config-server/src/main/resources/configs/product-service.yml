server:
  port: 8090

spring:
  cache:
    type: redis
  data:
    mongodb:
      uri: ${MONGO_PRODUCT_URL:mongodb://nexatech:nexatech123@localhost:27017/nexatech_products?authSource=admin&authMechanism=SCRAM-SHA-256}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      username: ${SPRING_DATA_REDIS_USERNAME:${REDIS_USERNAME:}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:${REDIS_SSL_ENABLED:false}}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:500ms}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:500ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    properties:
      security.protocol: PLAINTEXT
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB

aws:
  s3:
    region: ${AWS_REGION:ap-southeast-1}
    bucket: ${AWS_S3_BUCKET:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

product:
  internal:
    api-key: ${PRODUCT_INTERNAL_API_KEY:change-me}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      storageService:
        baseConfig: default
      orderService:
        baseConfig: default
        ignoreExceptions:
          - com.nexatech.product.exception.BadRequestException
          - com.nexatech.product.exception.ForbiddenException
          - com.nexatech.product.exception.ResourceNotFoundException
      inventoryService:
        baseConfig: default
  retry:
    instances:
      storageService:
        maxAttempts: 3
        waitDuration: 500ms
      orderService:
        maxAttempts: 3
        waitDuration: 300ms
      inventoryService:
        maxAttempts: 2
        waitDuration: 200ms

management:
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakerevents
