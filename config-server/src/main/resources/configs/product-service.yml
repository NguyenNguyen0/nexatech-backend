server:
  port: 8090

spring:
  data:
    mongodb:
      uri: ${MONGO_PRODUCT_URL:mongodb://nexatech:nexatech123@localhost:27017/nexatech_products?authSource=admin&authMechanism=SCRAM-SHA-256}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    properties:
      security.protocol: PLAINTEXT
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 55MB

product:
  internal:
    api-key: ${PRODUCT_INTERNAL_API_KEY:change-me}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      storageService:
        baseConfig: default
      orderService:
        baseConfig: default
        ignoreExceptions:
          - com.nexatech.product.exception.BadRequestException
          - com.nexatech.product.exception.ForbiddenException
          - com.nexatech.product.exception.ResourceNotFoundException
      inventoryService:
        baseConfig: default
  retry:
    instances:
      storageService:
        maxAttempts: 3
        waitDuration: 500ms
      orderService:
        maxAttempts: 3
        waitDuration: 300ms
      inventoryService:
        maxAttempts: 2
        waitDuration: 200ms

management:
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakerevents
