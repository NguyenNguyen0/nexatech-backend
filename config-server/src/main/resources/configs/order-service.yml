server:
  port: 8084

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/nexatech_orders}
    username: ${DB_USERNAME:nexatech}
    password: ${DB_PASSWORD:nexatech123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    consumer:
      group-id: order-service-group
      properties:
        request.timeout.ms: 30000
        default.api.timeout.ms: 30000
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 10000

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
