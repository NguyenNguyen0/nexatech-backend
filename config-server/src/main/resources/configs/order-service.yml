server:
  port: 8084

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/nexatech}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/nexatech_orders}
    username: ${DB_USERNAME:nexatech}
    password: ${DB_PASSWORD:nexatech123}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 7
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      username: ${SPRING_DATA_REDIS_USERNAME:${REDIS_USERNAME:}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:${REDIS_SSL_ENABLED:false}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service-group
      properties:
        request.timeout.ms: 30000
        default.api.timeout.ms: 30000
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 10000

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

order:
  idempotency:
    processing-timeout-seconds: ${ORDER_IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS:120}
  payment:
    pending-timeout-minutes: ${ORDER_PAYMENT_PENDING_TIMEOUT_MINUTES:20}
    pending-timeout-scan-delay-ms: ${ORDER_PAYMENT_PENDING_TIMEOUT_SCAN_DELAY_MS:60000}
