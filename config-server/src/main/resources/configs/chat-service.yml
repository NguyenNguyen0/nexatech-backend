server:
  port: 8089

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexatech_chats}
    username: ${DB_USERNAME:nexatech}
    password: ${DB_PASSWORD:nexatech123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
  data:
    mongodb:
      uri: ${MONGO_CHAT_URL:mongodb://nexatech:nexatech123@localhost:27017/nexatech_chats?authSource=admin&authMechanism=SCRAM-SHA-256}
      uuid-representation: standard
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      username: ${SPRING_DATA_REDIS_USERNAME:${REDIS_USERNAME:}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:${REDIS_SSL_ENABLED:false}}

app:
  presence-ttl-seconds: 90
  last-message-preview-length: 120
  guest-conversation-ttl-minutes: 1440
  assignment-agent-roles: STAFF

openfeign:
  user-service:
    url: ${OPENFEIGN_USER_SERVICE_URL:}
