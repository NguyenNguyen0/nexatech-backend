server:
  port: 8083

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_GROUP_ID}
    topics:
      user-registration: user-registration

openfeign:
  identity-service:
    url: ${IDENTITY_SERVICE_URL}

resilience4j:
  retry:
    instances:
      identityService:
        base-config: default
  circuitbreaker:
    instances:
      identityService:
        base-config: default
