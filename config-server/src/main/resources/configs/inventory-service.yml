server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nexatech_inventory
    username: ${DB_USERNAME:nexatech}
    password: ${DB_PASSWORD:nexatech}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: inventory-service-group
  data:
    redis:
      host: localhost
      port: 6379
