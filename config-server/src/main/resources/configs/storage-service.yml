server:
  port: 8088

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
  access-key: ${MINIO_ACCESS_KEY:nexatech-minio}
  secret-key: ${MINIO_SECRET_KEY:nexatech-minio-secret}
  bucket: ${MINIO_BUCKET:nexatech-products}
  region: ${MINIO_REGION:ap-southeast-1}
  path-style-access-enabled: ${MINIO_PATH_STYLE_ACCESS_ENABLED:true}
  use-direct-s3-url: ${MINIO_USE_DIRECT_S3_URL:false}
  # Base URL accessible by clients (via Kong gateway). Override in production with your public domain.
  public-url: ${MINIO_PUBLIC_URL:http://localhost:8000}

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
