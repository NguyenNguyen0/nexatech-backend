# ============================================================
# NexaTech — Infrastructure-only Docker Compose for local dev
# ============================================================
# Usage:
#   docker compose -f docker-compose-local.yml up -d
#
# Then run each Java service locally with the 'test' profile:
#   cd order-service   && mvn spring-boot:run -Dspring-boot.run.profiles=test
#   cd payment-service && mvn spring-boot:run -Dspring-boot.run.profiles=test
# ============================================================

services:
  postgres-order:
    image: postgres:16-alpine
    container_name: local-postgres-order
    environment:
      POSTGRES_DB: nexatech_orders
      POSTGRES_USER: nexatech
      POSTGRES_PASSWORD: nexatech123
    ports:
      - "5435:5432"
    volumes:
      - local-postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexatech -d nexatech_orders"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-net

  postgres-payment:
    image: postgres:16-alpine
    container_name: local-postgres-payment
    environment:
      POSTGRES_DB: nexatech_payments
      POSTGRES_USER: nexatech
      POSTGRES_PASSWORD: nexatech123
    ports:
      - "5437:5432"
    volumes:
      - local-postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexatech -d nexatech_payments"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-net

  redis:
    image: redis:7-alpine
    container_name: local-redis
    ports:
      - "6379:6379"
    volumes:
      - local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: local-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat,mntr"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/2181 && echo ruok >&3 && cat <&3' | grep -q imok"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks:
      - local-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: local-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - local-net

volumes:
  local-postgres-order-data:
  local-postgres-payment-data:
  local-redis-data:

networks:
  local-net:
    driver: bridge
