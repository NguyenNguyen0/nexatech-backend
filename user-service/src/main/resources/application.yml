spring:
  application:
    name: user-service
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties],optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}/"
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      username: ${SPRING_DATA_REDIS_USERNAME:${REDIS_USERNAME:}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:${REDIS_SSL_ENABLED:false}}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/nexatech}
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexatech_users}
    username: ${DATASOURCE_USERNAME:nexatech}
    password: ${DATASOURCE_PASSWORD:nexatech123}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Không block startup nếu DB chưa sẵn sàng — pool sẽ retry khi có request đầu tiên
      connection-timeout: 10000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:user-service-group}
    topics:
      user-registration: user-registration
      user-events: user.events
      audit-log: ${AUDIT_LOG_TOPIC:audit-topic}
  # Config client: nếu config-server offline thì bỏ qua, dùng giá trị local
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1500
        max-attempts: 4
        max-interval: 5000
        multiplier: 1.5

# ─── Fallback defaults khi config-server không phản hồi ──────────────────────
# Tất cả giá trị này sẽ bị override bởi config-server nếu nó online.
# Mục đích: service vẫn start được trong môi trường dev / khi config-server chưa ready.

server:
  port: ${SERVER_PORT:8083}

openfeign:
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8080/api/v1}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_INSTANCE_HOSTNAME:localhost}:8761/eureka/
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_ENABLED:true}
    fetch-registry: ${EUREKA_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.nexatech: DEBUG
    # Bật log khi config-server không phản hồi để dễ debug
    org.springframework.cloud.config.client: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 400ms
        retry-exceptions:
          - feign.RetryableException
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$InternalServerError
          - feign.FeignException$BadGateway
          - feign.FeignException$GatewayTimeout
          - java.net.SocketTimeoutException
          - java.io.IOException
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
