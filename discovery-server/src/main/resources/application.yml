server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    # Docker: truyền qua env var; local dev: mặc định localhost
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
