# ========================================================================================================
# DEV ENVIRONMENT
# (Docker môi trường development không network, không volume)
# Để tạo dbms chung khi triển khai mới tách database cho từng service => tiết kiệm RAM, disk space!!!
# ========================================================================================================

services:
  # ====== Postgres ======
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: keycloak # dbms dành cho keycloak tránh lỗi start docker => các service khác tự tạo thủ công theo name db của configserver
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4-ui
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
  #  Mongodb
  mongodb:
    image: mongo:7
    container_name: nexatech-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-nexatech}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-nexatech123}
      MONGO_INITDB_DATABASE: nexatech_products
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # ====== Kafka (KRaft mode) ======
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "9092:9092"
    environment:
      # ===== OVERVIEW =====
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # ===== LISTENER =====
      # INTERNAL: container trong Docker kết nối qua kafka:19092
      # EXTERNAL: app trên máy host kết nối qua localhost:9092
      # CONTROLLER: cổng quản lý metadata
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # ===== CONTROLLER/QUORUM =====
      # Local 1 node: id=1, địa chỉ kafka:9093.
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # ===== REPLICATION/PARTITION =====
      # Local để 1 để khởi động nhanh, ít tốn tài nguyên.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "9099:9099"
    environment:
      SERVER_PORT: 9099
      KAFKA_CLUSTERS_0_NAME: kraft-single
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka
  # ====== Keycloak ======
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak
    command:
      - start-dev
      - --health-enabled=true
    # healthcheck:
    #   test:
    #     ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 40s
    depends_on:
      - postgres
      - kafka
    ports:
      - "9000:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KAFKA_BOOTSTRAP_SERVER: kafka:19092
      KEYCLOAK_KAFKA_TOPIC: user-registration
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      JAVA_OPTS_APPEND: -Xms256m -Xmx512m

# ========================================================================================================
# RUN
# docker compose -f docker-compose-dev.yml up -d
# STOP
# docker compose -f docker-compose-dev.yml down
# REBUILD
# docker compose -f docker-compose-dev.yml up -d --build
# LOGS
# docker compose -f docker-compose-dev.yml logs -f
# RESET
# docker compose -f docker-compose-dev.yml down -v
