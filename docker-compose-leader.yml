services:
  postgres-order:
    image: postgres:16-alpine
    container_name: nexatech-postgres-order
    environment:
      POSTGRES_DB: nexatech_orders
      POSTGRES_USER: ${POSTGRES_USER:-nexatech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexatech123}
    ports:
      - "5435:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexatech} -d nexatech_orders"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexatech-net

  postgres-payment:
    image: postgres:16-alpine
    container_name: nexatech-postgres-payment
    environment:
      POSTGRES_DB: nexatech_payments
      POSTGRES_USER: ${POSTGRES_USER:-nexatech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexatech123}
    ports:
      - "5437:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexatech} -d nexatech_payments"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexatech-net

  redis:
    image: redis:7-alpine
    container_name: nexatech-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexatech-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nexatech-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat,mntr"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/2181 && echo ruok >&3 && cat <&3' | grep -q imok"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks:
      - nexatech-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexatech-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 60000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 60000
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - nexatech-net

  discovery-server:
    build:
      context: .
      args:
        SERVICE_NAME: discovery-server
    image: nexatech/discovery-server:latest
    container_name: nexatech-discovery
    ports:
      - "8761:8761"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx192m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - nexatech-net

  config-server:
    build:
      context: .
      args:
        SERVICE_NAME: config-server
    image: nexatech/config-server:latest
    container_name: nexatech-config
    ports:
      - "8888:8888"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_TOOL_OPTIONS=-Xmx192m
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - nexatech-net

  order-service:
    build:
      context: .
      args:
        SERVICE_NAME: order-service
    image: nexatech/order-service:latest
    container_name: nexatech-order
    ports:
      - "8084:8084"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-order:5432/nexatech_orders
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-nexatech}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-nexatech123}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATA_REDIS_HOST=redis
      - JAVA_TOOL_OPTIONS=-Xmx200m
    depends_on:
      config-server:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexatech-net

  payment-service:
    build:
      context: .
      args:
        SERVICE_NAME: payment-service
    image: nexatech/payment-service:latest
    container_name: nexatech-payment
    ports:
      - "8086:8086"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-payment:5432/nexatech_payments
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-nexatech}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-nexatech123}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_TOOL_OPTIONS=-Xmx200m
    depends_on:
      config-server:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nexatech-net

volumes:
  postgres-order-data:
  postgres-payment-data:
  redis-data:

networks:
  nexatech-net:
    driver: bridge
