_format_version: "3.0"

services:
  - name: identity-service
    url: http://identity-service:8081
    routes:
      - name: identity-route
        paths:
          - /api/v1/auth
        strip_path: false

  - name: user-service
    url: http://user-service:8082
    routes:
      - name: user-route
        paths:
          - /api/v1/users
        strip_path: false

  - name: product-service
    url: http://product-service:8090
    routes:
      - name: product-route
        paths:
          - /api/v1/products
          - /api/v1/categories
          - /api/v1/brands
          - /api/v1/reviews
          - /api/v1/admin/products
        strip_path: false

  - name: order-service
    url: http://order-service:8084
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 10000
    retries: 3
    routes:
      - name: order-route
        paths:
          - /api/v1/orders
          - /api/v1/cart
          - /api/v1/checkout
          - /api/v1/returns
          - /api/v1/admin/orders
          - /api/v1/admin/audit/orders
          - /api/v1/admin/audit/trace
        strip_path: false

  - name: inventory-service
    url: http://inventory-service:8085
    routes:
      - name: inventory-route
        paths:
          - /api/v1/inventory
        strip_path: false

  - name: payment-service
    url: http://payment-service:8086
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 10000
    retries: 3
    routes:
      - name: payment-route
        paths:
          - /api/v1/payments
          - /api/v1/admin/payments
          - /api/v1/admin/audit/payments
        strip_path: false

  - name: shipping-service
    url: http://shipping-service:8091
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 10000
    retries: 3
    routes:
      - name: shipping-route
        paths:
          - /api/v1/shipping
        strip_path: false

  - name: notification-service
    url: http://notification-service:8087
    routes:
      - name: notification-route
        paths:
          - /api/v1/notifications
        strip_path: false

  - name: chat-service
    url: http://chat-service:8089
    routes:
      - name: chat-route
        paths:
          - /api/v1/conversations
        strip_path: false
      - name: chat-ws-route
        paths:
          - /ws/chat
        strip_path: false

  - name: storage-service
    url: http://storage-service:8088
    routes:
      - name: storage-route
        paths:
          - /api/v1/files
        strip_path: false

  - name: news-service
    url: http://news-service:8092
    routes:
      - name: news-route
        paths:
          - /api/v1/news
        strip_path: false

  - name: promotion-service
    url: http://promotion-service:8093
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 10000
    retries: 3
    routes:
      - name: promotion-route
        paths:
          - /api/v1/promotions
          - /api/v1/flash-sales
          - /api/v1/admin/promotions
          - /api/v1/admin/flash-sales
          - /api/v1/internal/promotions
        strip_path: false

  - name: agent-service
    url: http://agent-service:8093
    routes:
      - name: agent-route
        paths:
          - /api/v1/agent
        strip_path: false

  - name: mcp-server
    url: http://mcp-server:8094
    routes:
      - name: mcp-route
        paths:
          - /api/v1/mcp
        strip_path: false

  - name: recommendation-service
    url: http://recommendation-service:8095
    routes:
      - name: recommendation-route
        paths:
          - /api/v1/recommendations
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:3001
        - http://localhost:3002
        - http://localhost:3003
        - http://localhost:3004
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Content-Type
        - Authorization
        - X-User-Id
        - X-User-Role
        - X-User-Email
        - X-Guest-Session-Id
        - Idempotency-Key
        - X-Requested-With
      exposed_headers:
        - X-Total-Count
      credentials: true
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 100
      policy: local
