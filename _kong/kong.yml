_format_version: "3.0"

services:
  - name: api-gateway
    url: http://api-gateway:8080
    routes:
      - name: api-gateway-route
        paths:
          - /api/v1
        strip_path: false

  - name: chat-service
    url: http://chat-service:8089
    routes:
      - name: chat-ws-route
        paths:
          - /ws/chat
        strip_path: false

  - name: storage-service
    url: http://storage-service:8088
    routes:
      - name: storage-route
        paths:
          - /api/v1/files
        strip_path: false

  - name: news-service
    url: http://news-service:8092
    routes:
      - name: news-route
        paths:
          - /api/v1/news
        strip_path: false

  - name: promotion-service
    url: http://promotion-service:8093
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 10000
    retries: 3
    routes:
      - name: promotion-route
        paths:
          - /api/v1/promotions
          - /api/v1/flash-sales
          - /api/v1/admin/promotions
          - /api/v1/admin/flash-sales
          - /api/v1/internal/promotions
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:3001
        - http://localhost:3002
        - http://localhost:3003
        - http://localhost:3004
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Content-Type
        - Authorization
        - X-User-Id
        - X-User-Role
        - X-User-Email
        - X-Guest-Session-Id
        - Idempotency-Key
        - X-Requested-With
      exposed_headers:
        - X-Total-Count
      credentials: true
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 100
      policy: local
