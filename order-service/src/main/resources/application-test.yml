server:
  port: 8084

spring:
  config:
    import: "optional:configserver:"
  datasource:
    url: jdbc:postgresql://localhost:5435/nexatech_orders
    username: nexatech
    password: nexatech123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service-group
      properties:
        request.timeout.ms: 30000
        default.api.timeout.ms: 30000
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 10000
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.nexatech: DEBUG

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

# Feign: use direct URLs instead of Eureka service discovery
product-service:
  url: http://localhost:8090
inventory-service:
  url: http://localhost:8085
payment-service:
  url: http://localhost:8086
