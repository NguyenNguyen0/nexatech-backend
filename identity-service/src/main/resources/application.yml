spring:
  application:
    name: identity-service
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties],optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}/"
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1500
        max-attempts: 4
        max-interval: 5000
        multiplier: 1.5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
