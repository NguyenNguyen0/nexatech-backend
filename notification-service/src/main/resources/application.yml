spring:
  application:
    name: notification-service
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties],optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}/"
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1500
        max-attempts: 4
        max-interval: 5000
        multiplier: 1.5
  datasource:
    hikari:
      initialization-fail-timeout: -1

app:
  admin-user-id: ${ADMIN_USER_ID:00000000-0000-0000-0000-000000000001}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
