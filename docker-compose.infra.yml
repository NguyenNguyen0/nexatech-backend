# ================================================================================================
# NEXATECH INFRASTRUCTURE FOR DEVELOPMENT
# Dùng để chạy các dịch vụ nền (Database, Auth, Storage, Messaging)
# Không bao gồm các Microservices (Chạy Microservices từ IDE để debug)
# ================================================================================================

services:
  # ====== Postgres (Dùng chung cho tất cả các service dùng SQL) ======
  postgres:
    image: postgres:16-alpine
    container_name: nexatech-infra-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: nexatech_db # DB mặc định, bạn có thể tạo thêm các DB khác bằng script hoặc Tool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nexatech_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== MongoDB (Dùng cho Product Service) ======
  mongodb:
    image: mongo:7
    container_name: nexatech-infra-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Redis (Caching) ======
  redis:
    image: redis:7-alpine
    container_name: nexatech-infra-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Kafka (Messaging - KRaft mode, không cần Zookeeper) ======
  kafka:
    image: apache/kafka:latest
    container_name: nexatech-infra-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Keycloak (IAM - Auth) ======
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: nexatech-infra-keycloak
    command: start-dev --import-realm
    volumes:
      - ./_realms/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "9000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ====== MinIO (Object Storage - Dùng cho Product Images) ======
  minio:
    image: minio/minio:latest
    container_name: nexatech-infra-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:
  minio_data:

networks:
  default:
    name: nexatech-infra-net
