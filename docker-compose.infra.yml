# ================================================================================================
# NEXATECH INFRASTRUCTURE FOR DEVELOPMENT (FIXED CREDENTIALS)
# ================================================================================================

services:
  # ====== Postgres (Dùng cho Identity, User, Order...) ======
  postgres:
    image: postgres:16-alpine
    container_name: nexatech-infra-postgres
    environment:
      POSTGRES_USER: nexatech
      POSTGRES_PASSWORD: nexatech123
      POSTGRES_DB: keycloak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./_postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexatech -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== MongoDB (Dùng cho Product Service) ======
  mongodb:
    image: mongo:7
    container_name: nexatech-infra-mongodb
    environment:
      # KHỚP VỚI config-server/src/main/resources/configs/product-service.yml
      MONGO_INITDB_ROOT_USERNAME: nexatech
      MONGO_INITDB_ROOT_PASSWORD: nexatech123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Redis (Caching) ======
  redis:
    image: redis:7-alpine
    container_name: nexatech-infra-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Kafka (Messaging) ======
  kafka:
    image: apache/kafka:latest
    container_name: nexatech-infra-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Keycloak (IAM) ======
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: nexatech-infra-keycloak
    command: start-dev --import-realm
    volumes:
      - ./_realms/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: nexatech
      KC_DB_PASSWORD: nexatech123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ====== MinIO (Storage) ======
  minio:
    image: minio/minio:latest
    container_name: nexatech-infra-minio
    command: server /data --console-address ":9001"
    environment:
      # KHỚP VỚI config-server/src/main/resources/configs/storage-service.yml
      MINIO_ROOT_USER: nexatech-minio
      MINIO_ROOT_PASSWORD: nexatech-minio-secret
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== MinIO Init (Auto-create bucket) ======
  minio-init:
    image: minio/mc:latest
    container_name: nexatech-infra-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nexatech-minio nexatech-minio-secret;
      mc mb --ignore-existing local/nexatech-products;
      mc anonymous set download local/nexatech-products;
      echo 'Bucket nexatech-products ready';
      "

  # ====== Kong Gateway (DB-less, declarative config) ======
  kong:
    profiles: ["monitoring"]
    image: kong:3.9
    container_name: nexatech-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8100:8100"
    volumes:
      - ./_kong/kong.yml:/kong/declarative/kong.yml:ro

  # ====== Monitored business services (optional demo profile) ======
  order-service:
    profiles: ["monitored-services"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: order-service
    container_name: nexatech-order-service
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_ENABLED: "false"
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexatech_orders
      DB_USERNAME: nexatech
      DB_PASSWORD: nexatech123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory-service:
    profiles: ["monitored-services"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: inventory-service
    container_name: nexatech-inventory-service
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_ENABLED: "false"
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      DB_HOST: postgres
      DB_USERNAME: nexatech
      DB_PASSWORD: nexatech123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    profiles: ["monitored-services"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
    container_name: nexatech-payment-service
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_ENABLED: "false"
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexatech_payments
      DB_USERNAME: nexatech
      DB_PASSWORD: nexatech123
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      VNPAY_TMN_CODE: demo
      VNPAY_HASH_SECRET: demo
      VNPAY_RETURN_URL: http://localhost:8080/api/v1/payments/vnpay/return
      VNPAY_IPN_URL: http://localhost:8080/api/v1/payments/vnpay/ipn
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  shipping-service:
    profiles: ["monitored-services"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: shipping-service
    container_name: nexatech-shipping-service
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_ENABLED: "false"
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexatech_shipping
      DB_USERNAME: nexatech
      DB_PASSWORD: nexatech123
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SHIPPING_PROVIDER: mock
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  promotion-service:
    profiles: ["monitored-services"]
    build:
      context: ./promotion-service
      dockerfile: Dockerfile
    container_name: nexatech-promotion-service
    environment:
      NODE_ENV: development
      PORT: 8093
      DATABASE_URL: postgresql://nexatech:nexatech123@postgres:5432/nexatech_promotions
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:19092
      KAFKA_GROUP_ID: promotion-service-group
      RESERVATION_TTL_SECONDS: 300
      SERVICE_NAME: promotion-service
      EUREKA_ENABLED: "false"
      EUREKA_INSTANCE_HOSTNAME: promotion-service
      EUREKA_INSTANCE_PORT: 8093
    ports:
      - "8093:8093"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ====== Prometheus ======
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    container_name: nexatech-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - kong

  # ====== Grafana ======
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    container_name: nexatech-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mongodb_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: nexatech-infra-net
